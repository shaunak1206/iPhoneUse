[project]
name = "iphone-mcp"
version = "0.3.0"
description = "Computer use for a real iPhone from a Mac: MCP tools, a CLI, a live dashboard and an HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4,<4",
  "pymobiledevice3>=11",
  "pillow>=10",
  "httpx>=0.27",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.scripts]
iphone = "iphone_mcp.cli:main"
iphone-mcp = "iphone_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iphone_mcp"]

[tool.setuptools.package-data]
iphone_mcp = ["assets/*.html"]

[tool.ruff]
line-length = 120
